services:
  gateway:
    build: .
    image: smartx-gateway:part1
    ports:
      - "8080:8080"
    environment:
      # Leave unset for local runs and the gateway generates a development key into the
      # storage volume. In anything resembling production, supply a real 32-byte
      # base64 key here (or via a secret) so attachments survive a volume rebuild:
      #   SmartX__AttachmentKey: "<base64 of 32 random bytes>"
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - smartx-storage:/app/storage
    restart: unless-stopped

volumes:
  smartx-storage:

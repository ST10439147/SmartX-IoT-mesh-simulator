name: CI/CD

on:
  push:
    branches:
      - '**' # Runs on pushes to all branches
  pull_request:
    branches:
      - '**' # Runs on pull requests targeting any branch

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: ST10439147_PROG7312_SmartX_POE/ST10439147_PROG7312_SmartX_POE.slnx
  API_PROJECT: ST10439147_PROG7312_SmartX_POE/ST10439147_PROG7312_SmartX_POE/SmartX.API.csproj

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Self-check (data structures + crypto)
        run: dotnet run --project ${{ env.API_PROJECT }} -c Release --no-build -- --selftest

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (API host + Blazor client)
        run: dotnet publish ${{ env.API_PROJECT }} -c Release -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartx-${{ github.sha }}
          path: publish

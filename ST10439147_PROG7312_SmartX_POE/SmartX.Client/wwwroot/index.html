<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-X Gateway Console</title>
    <meta name="description" content="Smart-X IoT mesh gateway: sensor ingestion, telemetry and anomaly-first monitoring." />
    <meta name="color-scheme" content="dark light" />
    <base href="/" />
    <script>
        // Apply the saved theme before first paint so there is no flash of the wrong palette.
        (function () {
            var t = localStorage.getItem('smartx-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
            window.smartXTheme = {
                get: function () { return document.documentElement.getAttribute('data-theme') || 'dark'; },
                toggle: function () {
                    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('smartx-theme', next);
                    return next;
                }
            };
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SmartX.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
